name: release

permissions:
  id-token: write
  pages: write

on:
  workflow_dispatch:
    inputs:
      docs_only:
        description: "upload docs without publishing to pypi"
        type: boolean

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
    - run: uv build
    - uses: actions/upload-artifact@v7
      with:
        name: artifact-dist
        path: dist/

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all
    - uses: pypa/cibuildwheel@v4.1
      env:
        CIBW_BUILD: cp311-*
        CIBW_ARCHS_LINUX: auto aarch64
        CIBW_ARCHS_MACOS: x86_64 arm64
        CIBW_TEST_COMMAND: python -c "import placeholder.partials"
    - uses: actions/upload-artifact@v7
      with:
        name: artifact-${{ matrix.os }}
        path: wheelhouse/

  publish:
    needs: [dist, wheels]
    runs-on: ubuntu-latest
    if: ${{ !inputs.docs_only }}
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist/
        pattern: artifact-*
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@release/v1

  pages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
    - uses: quarto-dev/quarto-actions/setup@v2
    - run: make html
    - uses: actions/upload-pages-artifact@v5
      with:
        path: great-docs/_site/
    - uses: actions/deploy-pages@v5
